# ──────────────────────────────────────────────────────────────────────────────
# CI — Compass (P3)
#
# Runs on every push to main/dev and on every pull request targeting main.
# Acts as the pre-deploy gate: no merge is safe if this is red.
#
# What it checks:
#   1. Unit tests (Vitest) — 1,265+ tests covering components, data loaders,
#      security utilities, and full page rendering with mocked data.
#   2. TypeScript type check — strict mode, catches type regressions.
#   3. ESLint — enforces coding conventions.
#
# Note: The Next.js static export build is NOT run here because it requires
# ~1.3 GB of pre-generated P2 data artifacts that live on the dev machine.
# TypeScript type-check catches the same class of errors that a build would.
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests + Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        env:
          # Override any project-level .npmrc (which points to corporate UHC
          # JFrog registry for local dev). CI must use public npm registry.
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          rm -f package-lock.json
          npm install --no-audit
        timeout-minutes: 15

      - name: Run unit tests
        run: npx vitest run --exclude='**/optum-regression*' --exclude='**/employer-normalization*' --exclude='**/predeploy-checks*' --exclude='**/real-data-integration*'

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
