# Compass: Multi-Environment Deployment Configuration
#
# This file maps environment names to AWS resources. It is read by
# scripts/deploy.sh and should be committed to git (no secrets).
#
# Architecture:
#   Dev   = localhost:3000 (no AWS resources)
#   Stage = stage.immigrationcompass.fyi → own S3 + CloudFront (Zscaler-approved)
#   Prod  = immigrationcompass.fyi → own S3 + CloudFront
#
# Resources are FULLY ISOLATED between environments.
# Format: ENVNAME_VARIABLE=value

